name: Sync Upstream (Automated MR/PR)

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository URL'
        required: true
        default: 'https://github.com/aradhyas8/Plume_Launcher.git'
      upstream_branch:
        description: 'Upstream branch to sync'
        required: true
        default: 'main'
      target_branch:
        description: 'Target branch in this repo'
        required: true
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || 'main' }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and Fetch Upstream
        id: fetch-upstream
        run: |
          UPSTREAM_URL="${{ github.event.inputs.upstream_repo || 'https://github.com/aradhyas8/Plume_Launcher.git' }}"
          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'main' }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'main' }}"

          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          NEW_COMMITS_COUNT=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          echo "NEW_COMMITS_COUNT=$NEW_COMMITS_COUNT" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> "$GITHUB_ENV"

      - name: Check for Changes
        id: check-changes
        run: |
          if [ "$NEW_COMMITS_COUNT" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits found in upstream repository. Everything is up to date."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found $NEW_COMMITS_COUNT new commit(s) in upstream repository."
          fi

      - name: Create Sync Branch and Merge Upstream
        if: steps.check-changes.outputs.has_changes == 'true'
        id: merge-upstream
        run: |
          SYNC_BRANCH="sync/upstream-${UPSTREAM_BRANCH}"
          git checkout -B "$SYNC_BRANCH" "$TARGET_BRANCH"

          echo "COMMITS_LOG<<EOF" >> "$GITHUB_ENV"
          git log --oneline --no-merges "$TARGET_BRANCH"..upstream/"$UPSTREAM_BRANCH" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          if git merge --no-edit upstream/"$UPSTREAM_BRANCH"; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
          fi

          git push origin "$SYNC_BRANCH" --force
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"

      - name: Create or Update Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="chore(upstream): sync changes from aradhyas8/Plume_Launcher ($UPSTREAM_BRANCH)"
          
          if [ "${{ steps.merge-upstream.outputs.merge_status }}" = "clean" ]; then
            PR_BODY="### 🤖 Automated Upstream Sync

Found **$NEW_COMMITS_COUNT** new commit(s) from upstream \`$UPSTREAM_BRANCH\`.

#### Upstream Commits:
\`\`\`text
$COMMITS_LOG
\`\`\`

✅ **Clean Merge:** Changes merged cleanly on top of custom modifications without overwriting local custom fixes.
Please review the changes and merge into \`$TARGET_BRANCH\`."
          else
            PR_BODY="### ⚠️ Automated Upstream Sync (Merge Conflict Detected)

Found **$NEW_COMMITS_COUNT** new commit(s) from upstream \`$UPSTREAM_BRANCH\`.

#### Upstream Commits:
\`\`\`text
$COMMITS_LOG
\`\`\`

⚠️ **Merge Conflict:** Upstream changes conflict with custom modifications.
Please checkout \`$SYNC_BRANCH\`, resolve conflicts locally, push, and merge this Pull Request into \`$TARGET_BRANCH\`."
          fi

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            echo "Creating new PR..."
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
